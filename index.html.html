const KEY='missao2030-v1';let state=null,old=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saved(){try{let s=JSON.parse(localStorage.getItem(KEY));return valid(s)?s:null}catch{return null}}
function valid(s){return !!(s&&s.version===1&&Array.isArray(s.teams)&&s.teams.length>=1&&s.teams.length<=6&&s.teams.every(t=>typeof t.name==='string'&&Number.isFinite(t.score)&&t.score>=0)&&Array.isArray(s.order)&&[8,16].includes(s.order.length)&&new Set(s.order).size===s.order.length&&s.order.every(i=>Number.isInteger(i)&&i>=0&&i<16)&&Number.isInteger(s.i)&&s.i>=0&&s.i<=s.order.length&&Array.isArray(s.history)&&s.history.length===s.i&&(!s.current||(Number.isInteger(s.current.owner)&&s.current.owner>=0&&s.current.owner<s.teams.length&&Number.isInteger(s.current.opponent)&&s.current.opponent>=0&&s.current.opponent<s.teams.length&&[0,1,2].includes(s.current.phase)&&Array.isArray(s.current.before)&&s.current.before.length===s.teams.length)))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function orderFor(mode){let e=MISSIONS.map((q,i)=>i).filter(i=>MISSIONS[i].kind==='eq'),p=MISSIONS.map((q,i)=>i).filter(i=>MISSIONS[i].kind==='pit');if(mode==='eq')return e;if(mode==='pit')return p;if(mode==='mixed8')return shuffle([...shuffle(e).slice(0,4),...shuffle(p).slice(0,4)]);return MISSIONS.map((_,i)=>i)}
function names(){let n=+document.getElementById('n').value;document.getElementById('names').innerHTML=Array.from({length:n},(_,i)=>`<div><label for="t${i}">Equipe ${i+1}</label><input id="t${i}" maxlength="24" placeholder="Equipe ${i+1}" aria-label="Nome da equipe ${i+1}"></div>`).join('')}
function home(){if(state){save();old=state}state=null;document.getElementById('app').innerHTML=`${old?'<div class="resume"><span>Há uma missão salva neste navegador.</span><button class="ghost small" onclick="resume()">Continuar partida →</button></div>':''}<section class="hero"><div><span class="eyebrow">UM DESAFIO. DUAS ÁREAS. UMA EQUIPE.</span><h1>O futuro pede<br><em>boas contas.</em></h1><p class="lead">Uma comunidade precisa cuidar da água, observar o ambiente e planejar suas ações. Sua equipe resolve no papel e toma decisões na tela.</p><div class="hero-actions"><button onclick="document.getElementById('setup').scrollIntoView({behavior:'smooth'})">Preparar a missão ↗</button><button class="ghost" onclick="practice()">Fazer o treino</button></div></div><div class="planet-stage" aria-label="Terra e conceitos matemáticos do jogo"><span class="orbit"></span><img src="${EARTH}" alt="Composição de imagens da Terra, Blue Marble 2002, NASA."><span class="signal">CENTRAL DE MISSÕES</span><div class="floating float-a"><strong>2x + 10 = 50</strong>um problema · uma incógnita</div><div class="floating float-b"><strong>a² = b² + c²</strong>distâncias · conexões · decisões</div><span class="planet-caption">Blue Marble 2002 · NASA Earth Observatory · composição histórica</span></div></section><section class="steps" aria-label="Etapas da missão"><div class="step"><span>01</span><div><h3>Investigue no papel</h3><p>Localize a missão pelo código e registre o raciocínio.</p></div></div><div class="step"><span>02</span><div><h3>Responda na tela</h3><p>Escolha o resultado e interprete a situação de Ciências.</p></div></div><div class="step"><span>03</span><div><h3>Responda, passe ou repasse</h3><p>Vale 10 pontos. Com uma dica, vale 5.</p></div></div></section><section id="setup" class="setup"><div><span class="eyebrow">A COMUNIDADE CONTA COM VOCÊS</span><h2>Organizar a partida</h2><div class="fields"><div><label for="mode">Roteiro</label><select id="mode"><option value="all">16 missões · percurso completo</option><option value="mixed8">8 missões · seleção mista</option><option value="eq">8 missões · equações</option><option value="pit">8 missões · Pitágoras</option></select></div><div><label for="n">Equipes</label><select id="n" onchange="names()"><option value="1">1 · treino sem disputa</option><option value="2" selected>2 equipes</option><option value="3">3 equipes</option><option value="4">4 equipes</option><option value="5">5 equipes</option><option value="6">6 equipes</option></select></div></div></div><div class="names" id="names"></div><div class="setup-start"><button onclick="start()">Iniciar missão →</button><p>1 caderno impresso por equipe.<br>Sem cronômetro e sem respostas digitadas.<br>As duas escolhas precisam estar corretas.</p></div></section><section class="resources"><div class="resource"><div><h3>Caderno da equipe</h3><p>Instruções, treino e espaço para as 16 missões.</p></div><button class="ghost small" onclick="pdf('student')">Baixar PDF ↓</button></div><div class="resource"><div><h3>Guia dos professores</h3><p>Organização, mediação e todas as resoluções.</p></div><button class="ghost small" onclick="pdf('teacher')">Baixar PDF ↓</button></div></section><p class="footnote">Os números são fictícios. Os esquemas geométricos são didáticos, sem escala. “2030” é o nome da missão, não uma previsão. <button class="ghost small" onclick="credits()">Fontes e créditos</button> <button class="ghost small" onclick="downloadGame()">Baixar jogo offline</button></p>`;names()}
function start(){if(old&&!confirm('Substituir a partida salva por uma nova?'))return;const n=+document.getElementById('n').value;state={version:1,teams:Array.from({length:n},(_,i)=>({name:document.getElementById('t'+i).value.trim()||'Equipe '+(i+1),score:0})),order:orderFor(document.getElementById('mode').value),i:0,history:[],current:null};old=null;save();render();window.scrollTo(0,0)}

function geom(q){let t=q.tri;if(!t)return `<div class="equation-card"><div><span class="x">x</span><p>Uma quantidade ainda é desconhecida.<br>Organize os dados e monte a equação no papel.</p></div><small>IDENTIFICAR → MONTAR → RESOLVER → CONFERIR</small></div>`;let b=t.base,h=t.height,hyp=t.hyp,scale=Math.min(290/b,115/h),x=75,y=145,w=b*scale,z=h*scale;return `<svg viewBox="0 0 450 180" role="img" aria-label="Triângulo retângulo: base ${b} ${t.unit}, altura ${t.unknown==='height'?'desconhecida':h+' '+t.unit}, hipotenusa ${t.unknown==='hyp'?'desconhecida':hyp+' '+t.unit}."><path d="M${x},${y}V${y-z}L${x+w},${y}Z" fill="#c9ddba" stroke="#537a50" stroke-width="2"/><path d="M${x},${y-12}h12v12" fill="none" stroke="#537a50" stroke-width="1.5"/><text x="${x+w/2}" y="${y+22}" text-anchor="middle" font-size="15" fill="#3a613e">${b} ${t.unit}</text><text x="${x-13}" y="${y-z/2}" text-anchor="end" font-size="15" fill="#3a613e">${t.unknown==='height'?'x':h+' '+t.unit}</text><text x="${x+w/2+22}" y="${y-z/2-12}" font-size="16" fill="#3a613e" font-weight="bold">${t.unknown==='hyp'?'x':hyp+' '+t.unit}</text><text x="436" y="171" text-anchor="end" font-size="8" fill="#71896a">ESQUEMA SEM ESCALA · ÂNGULO RETO INDICADO</text></svg>`}
function render(){if(state.i>=state.order.length){finish();return}let q=MISSIONS[state.order[state.i]],r=round(),team=active(),multi=state.teams.length>1;document.getElementById('app').innerHTML=`<div class="bar"><div class="mission-title"><span class="mission-code">${q.id}</span><div><h1>${q.title}</h1><p>${q.kind==='eq'?'EQUAÇÃO DE 1º GRAU':'TEOREMA DE PITÁGORAS'} · ${q.theme} · ${state.i+1}/${state.order.length}</p></div></div><div class="progress" aria-label="${state.i} de ${state.order.length} missões concluídas">${state.order.map((_,i)=>`<i class="${i<state.i?'done':''}"></i>`).join('')}</div></div><div class="teams">${state.teams.map((t,i)=>`<div class="team ${i===team?'active':''}"><div><strong>${esc(t.name)}</strong><small>${i===team?'É sua vez':multi&&i===(r.phase===1?r.owner:r.opponent)?'Adversária desta rodada':'Acompanha a missão'}</small></div><b>${t.score}</b></div>`).join('')}</div><div class="round-route ${r.phase===2?'rep':''}"><div><strong>${r.answered?'RODADA ENCERRADA':r.phase===0?'RESPONDE OU PASSA':r.phase===1?'RESPONDE OU REPASSA':'AGORA: RESPONDE OU PAGA'}</strong><br>${esc(state.teams[r.owner].name)}${r.route.map((t,i)=>' → '+(i===0?'passou':'repassou')+' → '+esc(state.teams[t].name)).join('')}</div><span>Missão completa: <b>${r.hint?5:10} pts</b>${r.phase===2?' · erro ou pagamento: −5':''}</span></div><section class="sheet"><div class="brief"><div class="label">NO PAPEL<br>Código ${q.id} · página ${Math.floor(state.order[state.i]/2)+3}</div><p>${q.story}</p></div><div class="challenge"><section class="math"><div class="section-number"><b>1</b> CALCULE E SELECIONE</div><h2>${q.ask}</h2><div class="calc-visual">${geom(q)}</div><div class="number-choices" role="group" aria-label="Resultado do cálculo">${q.options.map((o,j)=>`<button class="num-choice ${r.math===j?'selected':''} ${r.answered&&j===q.answer?'correct':''} ${r.answered&&r.math===j&&j!==q.answer?'wrong':''}" aria-pressed="${r.math===j}" onclick="choose('math',${j})" ${r.answered?'disabled':''}>${o}</button>`).join('')}</div><p style="font-size:10px;color:#75866e;margin:9px 0 0">O professor pode pedir que a equipe apresente a conta.</p></section><section class="science"><div class="section-number"><b>2</b> INTERPRETE E DECIDA</div><h2>${q.science}</h2><div class="science-choices" role="group" aria-label="Decisão de Ciências">${q.scienceOptions.map((o,j)=>`<button class="science-choice ${r.science===j?'selected':''} ${r.answered&&j===q.scienceAnswer?'correct':''} ${r.answered&&r.science===j&&j!==q.scienceAnswer?'wrong':''}" aria-pressed="${r.science===j}" onclick="choose('science',${j})" ${r.answered?'disabled':''}><span>${String.fromCharCode(65+j)}</span>${o}</button>`).join('')}</div>${r.answered?'':`<label class="paper-check"><input type="checkbox" ${r.paper?'checked':''} onchange="markPaper(this.checked)">Registramos o cálculo e a justificativa no caderno.</label><p class="error" id="error" role="alert"></p><div class="actions"><button onclick="check()">Confirmar as duas respostas</button><button class="ghost" onclick="hint()" ${r.hint?'disabled':''}>${r.hint?'Dica usada · vale 5':'Dica · passa a valer 5'}</button>${multi&&r.phase<2?`<button class="ghost" onclick="pass()">${r.phase===0?'Passar →':'Repassar ↩'}</button>`:''}${multi&&r.phase===2?'<button class="peach" onclick="pay()">Pagar 5 pontos</button>':''}</div>`}${r.hint?`<div class="hint"><strong>Dica de Matemática</strong><br>${q.hint}</div>`:''}</section></div>${r.answered?reveal(q,r):''}</section><div class="bottom"><div><button class="ghost small" onclick="home()">Pausar</button><button class="ghost small" onclick="practice()">Consultar fórmulas</button>${r.phase>0&&!r.answered?'<button class="ghost small" onclick="undoPass()">Desfazer passagem</button>':''}${state.i>0&&!r.answered?'<button class="ghost small" onclick="undo()">Voltar uma rodada</button>':''}</div><p>Discutam. Registrem. Decidam.<br>Sem pressa e sem cronômetro.</p></div>`}
function choose(kind,i){let r=round();if(r.answered)return;r[kind]=i;save();const cls=kind==='math'?'.num-choice':'.science-choice';document.querySelectorAll(cls).forEach((b,j)=>{b.classList.toggle('selected',j===i);b.setAttribute('aria-pressed',String(j===i))});document.getElementById('error').textContent=''}
function markPaper(v){round().paper=v;save()}
function hint(){let r=round();if(r.answered||r.hint)return;r.hint=true;save();render()}
function pass(){let r=round();if(state.teams.length<2||r.answered||r.phase>=2)return;r.phase++;r.route.push(active());r.math=null;r.science=null;r.paper=false;save();render()}
function undoPass(){let r=round();if(r.answered||!r.phase)return;r.phase--;r.route.pop();r.math=null;r.science=null;r.paper=false;save();render()}
function check(){let r=round();if(r.answered)return;if(r.math===null||r.science===null){document.getElementById('error').textContent='Selecione o resultado e uma decisão de Ciências.';return}if(!r.paper){document.getElementById('error').textContent='Registrem o raciocínio no papel e marquem a confirmação.';return}let q=MISSIONS[state.order[state.i]];settle(r.math===q.answer&&r.science===q.scienceAnswer,false)}
function settle(ok,paid){let r=round();if(r.answered)return;let t=active(),before=state.teams[t].score,delta=ok?(r.hint?5:10):(state.teams.length>1&&r.phase===2?-5:0);state.teams[t].score=Math.max(0,before+delta);Object.assign(r,{answered:true,ok,paid,team:t,delta:state.teams[t].score-before});save();render()}
function pay(){let r=round();if(r.answered||r.phase!==2||state.teams.length<2)return;settle(false,true)}
function reveal(q,r){return `<div class="reveal" aria-live="polite"><span class="badge">CONFERIR · COMPREENDER · CORRIGIR NO CADERNO</span><h3>${r.ok?'Missão resolvida! +'+r.delta+' pontos':r.paid?'Equipe escolheu pagar · '+r.delta+' pontos':r.delta<0?'Após o repasse: '+r.delta+' pontos':'Vamos revisar o raciocínio'}</h3><div class="reveal-grid"><div><strong style="font-size:11px">MATEMÁTICA · ${q.options[q.answer]}</strong><div class="resolution">${q.model}<br>${q.steps.join('<br>')}</div></div><div><strong style="font-size:11px">CIÊNCIAS · ${q.scienceOptions[q.scienceAnswer]}</strong><p>${q.explain}</p>${r.paid?'':`<p style="margin-top:10px"><b>Cálculo:</b> ${r.math===q.answer?'correto':'rever'} · <b>Decisão:</b> ${r.science===q.scienceAnswer?'correta':'rever'}. Pontos exigem as duas respostas corretas.</p>`}${!r.ok&&r.phase===2&&r.delta>-5?'<small>O desconto foi limitado ao saldo disponível. O placar mínimo é zero.</small>':''}</div></div><div class="actions"><button onclick="next()">${state.i===state.order.length-1?'Ver resultado final':'Próxima missão →'}</button></div></div>`}
function next(){let r=round();if(!r.answered)return;state.history.push({...r,question:state.order[state.i],before:r.before.slice(),route:r.route.slice()});state.i++;state.current=null;save();render();window.scrollTo(0,0)}
function undo(){if(state.current?.answered||!state.history.length||!confirm('Desfazer a última rodada e restaurar o placar anterior?'))return;let r=state.history.pop();state.teams.forEach((t,i)=>t.score=r.before[i]);state.i--;state.current=null;save();render();window.scrollTo(0,0)}
function finish(){let ranks=state.teams.map(t=>({...t})).sort((a,b)=>b.score-a.score);document.getElementById('app').innerHTML=`<section class="finish"><span class="eyebrow">MISSÃO CONCLUÍDA · ${state.order.length} DESAFIOS</span><h1>Boas contas.<br><em style="font-family:Georgia;color:var(--mint);font-weight:normal">Novas conexões.</em></h1><p class="lead">O placar registra o jogo. O caderno mostra o caminho que vocês percorreram.</p><div>${ranks.map(t=>`<div class="rank"><span>${ranks.findIndex(x=>x.score===t.score)+1}º · ${esc(t.name)}</span><b>${t.score} pts</b></div>`).join('')}</div><div class="actions"><button onclick="restart()">Nova partida</button><button class="ghost" onclick="report()">Baixar resultado</button><button class="ghost" onclick="home()">Voltar ao início</button></div><div class="review"><h2>Revisão das missões</h2>${state.history.map(r=>{let q=MISSIONS[r.question];return `<details><summary>${q.id} · ${q.title} · ${esc(state.teams[r.team].name)} · ${r.delta>0?'+':''}${r.delta} pts</summary><p><b>${q.model}</b><br>${q.steps.join(' → ')}</p><p>${q.explain}</p></details>`}).join('')}</div></section>`}
function restart(){if(!confirm('Começar novamente e zerar o placar?'))return;state.teams.forEach(t=>t.score=0);state.i=0;state.history=[];state.current=null;save();render()}
function modal(title,body){let m=document.getElementById('modal');m.className='modal';m.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="close small" onclick="closeModal()">Fechar ×</button><span class="eyebrow">CENTRAL DE APOIO</span><h2 id="modalTitle">${title}</h2>${body}</div>`;m.querySelector('button').focus();m.onclick=e=>{if(e.target===m)closeModal()}}
function closeModal(){document.getElementById('modal').className='hidden';document.getElementById('modal').innerHTML='';document.querySelector('header button').focus()}
function guide(){modal('Como jogar',`<div class="grid2"><div><h3>Antes da partida</h3><ol><li>Imprima um <b>Caderno da equipe</b> para cada grupo. Separe lápis, borracha e, se desejado, calculadora.</li><li>Faça os dois treinos com a turma. Não valem pontos.</li><li>Escolha o roteiro e cadastre de 1 a 6 equipes. Use o mesmo computador, de preferência com projeção.</li></ol><h3>Em cada missão</h3><ol><li>Localize no papel o código da tela: E = equação; P = Pitágoras.</li><li>Leiam os dados. Escrevam o modelo, as contas e a justificativa.</li><li>Um representante seleciona o resultado e a decisão de Ciências.</li><li>Marque a confirmação do registro no caderno. Só então confirme as duas respostas.</li><li>Leiam a resolução e corrijam o caderno antes de avançar.</li></ol></div><div><h3>Passa ou repassa</h3><ol><li>A equipe inicial responde ou <b>passa</b>.</li><li>A adversária responde ou <b>repassa</b>.</li><li>A pergunta volta à inicial, que deve responder ou <b>pagar 5 pontos</b>.</li></ol><div class="info-box"><b>10 pontos</b> se o cálculo e a decisão estiverem corretos. Com dica: <b>5 pontos</b>. Não há pontuação parcial.<br>Erro antes do repasse encerra a rodada sem desconto. Após repasse, erro ou pagamento desconta 5 pontos. Placar mínimo: zero.</div><p>Passar vale para a missão inteira. A dica permanece e reduz seu valor para qualquer equipe. As escolhas anteriores são apagadas ao passar.</p><p>Com mais de duas equipes, os pares alternam. Uma equipe joga como treino, sem passagens nem descontos. Não há cronômetro.</p></div></div><h3>Combinados</h3><p>Alternem quem lê, calcula, confere e responde no computador. Consultar fórmulas ou os professores é livre; usar o botão de dica reduz o valor. Os professores definem previamente o uso de calculadora. O jogo não confere automaticamente o que foi escrito no papel.</p><p>O progresso é salvo somente neste navegador. Não há login. Use o botão Pausar para sair de uma rodada e continuar depois.</p>`)}
function practice(){modal('Treino antes da missão',`<div class="info-box">Consulta livre, sem perda de pontos. A dica específica de uma missão é que reduz seu valor.</div><div class="grid2"><div><h3>Equação de 1º grau</h3><p>A letra representa uma quantidade desconhecida. Para manter a igualdade, faça a mesma operação nos dois lados.</p><div class="practice"><b>Treino 1 · A caixa de amostras</b><p>Há 4 amostras já separadas. Três caixas iguais completam 19 amostras. Quantas amostras há em cada caixa?</p><p>Modelo: <b>3x + 4 = 19</b></p><button onclick="training(this,0,false)">3</button><button onclick="training(this,0,true)">5</button><button onclick="training(this,0,false)">7</button><p class="train-feedback" aria-live="polite"></p><details><summary>Ver a resolução</summary><p>3x = 19 − 4 → 3x = 15 → x = 5.<br>Conferindo: 3 × 5 + 4 = 19.</p></details></div></div><div><h3>Teorema de Pitágoras</h3><p>Em um triângulo retângulo: <b>a² = b² + c²</b>. A hipotenusa (a) fica oposta ao ângulo de 90° e é o maior lado. Os catetos são b e c.</p><div class="practice"><b>Treino 2 · Uma diagonal</b><p>Um retângulo tem lados de 3 m e 4 m. Quanto mede a diagonal?</p><button onclick="training(this,1,true)">5 m</button><button onclick="training(this,1,false)">7 m</button><button onclick="training(this,1,false)">25 m</button><p class="train-feedback" aria-live="polite"></p><details><summary>Ver a resolução</summary><p>d² = 3² + 4² = 9 + 16 = 25.<br>d = √25 = 5 m, e não 25 m.<br>Se a hipotenusa for conhecida, subtraia os quadrados para achar um cateto.</p></details></div></div></div><h3>Verifique antes de responder</h3><p>O resultado tem a unidade correta? A incógnita responde ao que foi pedido? No desenho, há um ângulo reto? A conclusão de Ciências respeita os dados, sem afirmar mais do que eles permitem?</p>`)}
function training(el,n,ok){el.parentElement.querySelector('.train-feedback').textContent=ok?'Correto! Abra a resolução e confira o caminho.':n===0?'Reveja: retire 4 das 19 amostras e divida o restante entre 3 caixas.':'Reveja: o quadrado da diagonal é 25. Falta calcular a raiz quadrada.'}
function materials(){modal('Papel e tela, em sintonia',`<p>Imprima o caderno em A4, preferencialmente frente e verso. Os códigos E01–E08 e P01–P08 são fixos e aparecem tanto no papel quanto na tela, mesmo em uma seleção de 8 missões.</p><div class="resources"><div class="practice"><h3>Caderno da equipe</h3><p>10 páginas · instruções, dois treinos e 16 missões com espaço para contas e justificativas.</p><button onclick="pdf('student')">Baixar caderno PDF</button></div><div class="practice"><h3>Guia dos professores</h3><p>Organização da aula, mediação, conferência e gabarito comentado. Entregar somente aos professores.</p><button onclick="pdf('teacher')">Baixar guia PDF</button></div></div><p>Na partida, o professor pode conferir a folha antes da confirmação. O sistema verifica as duas escolhas na tela; a avaliação do registro escrito é feita pelos professores.</p>`)}
function credits(){modal('Créditos e limites',`<p>Imagem de abertura: <b>Blue Marble 2002 · NASA Earth Observatory</b>, composição de observações de satélite. Fonte: <a href="https://science.nasa.gov/resource/blue-marble-2002/" target="_blank" rel="noopener">NASA Science</a>. Uso educativo conforme as <a href="https://www.nasa.gov/nasa-brand-center/images-and-media/" target="_blank" rel="noopener">diretrizes de uso de mídia da NASA</a>. Não é uma fotografia atual nem implica endosso ao jogo.</p><p>Enunciados, organização, interface e esquemas geométricos foram elaborados para esta atividade. Todos os valores dos problemas são fictícios; não são preços, medições ambientais ou recomendações de engenharia reais. Os desenhos indicam relações geométricas e não estão em escala.</p><p>Matemática: equações de 1º grau e relações entre os lados de um triângulo retângulo. Ciências: água, vegetação, chuva, energia, resíduos, monitoramento e limites das evidências. O jogo é um recurso de participação, não uma avaliação padronizada.</p>`)}
function download(name,type,content){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function pdf(kind){let a=document.createElement('a');a.href=FILES[kind];a.download=kind==='student'?'Caderno_Equipe_Missao2030.pdf':'Guia_Professor_Missao2030.pdf';a.click()}
function downloadGame(){download('Missao2030_Jogo.html','text/html;charset=utf-8','<!doctype html>\n'+document.documentElement.outerHTML.replace(/<main id="app">[\s\S]*?<\/main>/,'<main id="app"></main>').replace(/<div id="modal"[\s\S]*?<\/div><script>/,'<div id="modal" class="hidden"></div><script>'))}
function report(){let t='MISSÃO 2030 - CIÊNCIAS + MATEMÁTICA\n'+state.order.length+' missões\n\n'+state.teams.map(t=>t.name+': '+t.score+' pts').join('\n')+'\n\n'+state.history.map(r=>{let q=MISSIONS[r.question];return q.id+' - '+q.title+'\nEquipe: '+state.teams[r.team].name+' | Pontos: '+r.delta+' | Dica: '+(r.hint?'sim':'não')+'\nMatemática: '+q.options[q.answer]+'\n'+q.model+'\n'+q.steps.join(' → ')+'\nCiências: '+q.scienceOptions[q.scienceAnswer]+'\n'+q.explain}).join('\n\n');download('Resultado_Missao2030.txt','text/plain;charset=utf-8',t)}
function full(){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()}
document.addEventListener('keydown',e=>{let m=document.getElementById('modal');if(e.key==='Escape'&&!m.classList.contains('hidden'))closeModal();if(e.key==='Tab'&&!m.classList.contains('hidden')){let a=m.querySelectorAll('button,a[href],input,select,summary'),first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});old=saved();home();
</script></body></html>
